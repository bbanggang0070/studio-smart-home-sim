# ---- 변경 기록 (판정 동결 전 개발 실행에서 고친 것) -------------------------------------------
#  2026-10-28 v0.1 작성
#  2026-10-29 v0.5b (v1.31-H) — 에너지 비교를 A → A′V (같은 환기) · '== 0' → '≤ 0.05' · C6H 시작 결로 예외 표시
#  2026-10-29 v0.5 (v1.31-H) — H3 '가스 ≤ A' 삭제 (A 는 기본 환기 없음) · H8 기본 환기 판정을 시각별 모드 목표(base_vent_compliance_mode)로
#  2026-10-28 v0.4 개발 실행 hdev3 — H14 동파 알림 판정 삭제 (12 °C 유지로 위험에 가지 않음 · 결과 판정만) · H9 비교 대상 A → A2
#                (A 는 22 °C 상시 — 다른 일) · 제어기: 외출 중 빨래 건조는 셋백하지 않음
#  2026-10-28 v0.3 개발 실행 hdev2 — H5 · H13 온도 판정 → 요리 뒤 30분 18 °C (후드 · 급기 손실 2.6 kW > 바닥난방 출력: 모든 방식 불가) ·
#                H8 가스 vs A 삭제 (A 는 환기 안 함 — 다른 일을 비교) · H6 샤워 30분 뒤 · H9 건조 → 기준선 A 보다 빠름 · H14 시작 16 °C 평형
#  2026-10-28 v0.2b 10 h 이상 시나리오는 로그 10 s 간격 (디스크 — 72 h 실행당 약 1 GB)
#  2026-10-28 v0.2 개발 실행 hdev1 — 바닥이 공기 온도에서 시작해 A(22 °C 켜 둠)까지 처음 몇 시간 식음 → 시작 상태를 72 h 평형으로 (thermal_steady) · mass · envelope 직접 지정 삭제
