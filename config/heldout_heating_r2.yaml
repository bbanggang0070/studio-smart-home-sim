# ============================================================================
#  난방 확장 트랙 보류(held-out) 2차 — HH201–HH212 — **마지막 차수** (docs/15 §6)
#  - 1차(HH101–HH112) 결과에서 제어기 결함은 없었다 → 제어기 · 판정 동결(freeze_heating) 그대로, 새 조합만
#  - 1차의 작성 오류(t = 0 결로)를 막으려 등록 전에 tools/check_scenarios.py 를 돌려 통과한 것만 등록한다
#  - 판정 문구는 개발 · 1차와 같은 종류 · 결과는 고치지 않고 그대로 보고한다
#  - 작성 점검표: ① thermal_steady ② 시작 결로 여유 > 0 (도구로 계산) ③ 창문 '== 0' 없음 ④ 물리적으로 모든 방식이 불가능한
#    판정 없음 (후드 손실 · 겨울 빨래 · 일사 과열 한계) ⑤ 다른 일을 하는 기준선과의 에너지 · 시간 비교 없음 (A 는 기본 환기 없음)
#  2026-10-28 작성
# ============================================================================
scenarios:
