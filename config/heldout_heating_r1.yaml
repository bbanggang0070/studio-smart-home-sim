    tier: 2
    name: "야근 늦은 귀가 23:00 — 예측보다 늦은 귀가 ↔ 프리히팅 낭비"
    duration_s: 54000                    # 08:00 – 23:00
    log_interval_s: 10
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20262901
    run_mode: fast
    appliance_profile: full_heating
    season: winter
    persona: commuter
    power_limit_w: 3000
    environment_overrides: { heating.mode: hydronic }
    initial:
      thermal_steady: true
      user_mode: NORMAL
      temperature_c: 21.0
      humidity_pct: 40.0
      co2_ppm: 800.0
      pm25_ugm3: 8.0
      illuminance_lux: 300.0
      occupancy: true
      occupant_zone: room
      time_of_day: "08:00"
      window_open_ratio: 0.0
      blind_angle_deg: 0.0
      appliances: { purifier_level: 0, boiler: { power: true, setpoint: 21.0 } }
    external:
      weather: cloudy
      outdoor_pm25_ugm3: 15.0
      outdoor_temp_c: -6.0
      outdoor_rh_pct: 60.0
      outdoor_illuminance_lux: 6000.0
    injections:
      - { at_s: 1500, door: open_close, label: leave, open_s: 8 }
      - { at_s: 50400, door: open_close, label: arrive, open_s: 8 }     # 22:00 귀가
    events:
      - { at_s: 1504, set: { occupancy: false, occupant_zone: none } }
      - { at_s: 21600, set: { outdoor_temp_c: -2.0, outdoor_illuminance_lux: 12000.0 } }
      - { at_s: 36000, set: { outdoor_temp_c: -5.0, outdoor_illuminance_lux: 0.0 } }
      - { at_s: 50400, set: { occupancy: true, occupant_zone: room } }
    pass_criteria:
      - "temperature >= 14.0 for all t"
      - "temperature >= 19.5 by 3600 after arrive_start"
      - "dew_margin >= 0 for all t"
      - "energy_cost_won <= baseline_A.energy_cost_won"
    metrics: [cold_discomfort_kh, gas_kwh, energy_cost_won, expected_cost_heating]

