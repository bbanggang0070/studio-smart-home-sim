    duration_s: 43200                    # 09:00 – 21:00
    log_interval_s: 10
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20263001
    run_mode: fast
    appliance_profile: full_heating
    season: winter
    persona: home
    power_limit_w: 3000
    environment_overrides: { heating.mode: hydronic }
    initial:
      thermal_steady: true
      user_mode: STUDY
      temperature_c: 21.0
      humidity_pct: 38.0
      co2_ppm: 800.0
      pm25_ugm3: 8.0
      illuminance_lux: 400.0
      occupancy: true
      occupant_zone: desk
      time_of_day: "09:00"
      window_open_ratio: 0.0
      blind_angle_deg: 0.0
      appliances: { purifier_level: 0, boiler: { power: true, setpoint: 21.0 } }
    external:
      weather: cloudy
      outdoor_pm25_ugm3: 15.0
      outdoor_temp_c: -2.0
      outdoor_rh_pct: 55.0
      outdoor_illuminance_lux: 15000.0
    injections:
      - { at_s: 10800, door: open_close, label: lunch_out, open_s: 8 }
      - { at_s: 14400, door: open_close, label: lunch_back, open_s: 8 }
      - { at_s: 34200, source: cooking, label: cooking, stove: induction_plug, pm_mg_per_min: 1.2,
