# ============================================================================
#  난방 확장 트랙 보류(held-out) 1차 — HH101–HH112 (docs/15 §3 · §6)
#  - 판정 · 제어기 동결(freeze_heating · 2026-10-28) 뒤, 동결 제어기로 돌려 보기 전에 썼다 — 개발 세트(H1–H14)에 없는 조합
#  - 판정 문구는 개발 세트와 같은 종류만 쓴다 (환경 결과 위주 · 수단 · 과정은 최소)
#  - 실행 전에 커밋하고 해시를 등록한다. 결과로 제어기를 고치면 1차 결과는 그대로 보고하고 2차(마지막)로 다시 잰다
#  - 작성 점검표: ① 시작 상태 thermal_steady (72 h 평형) ② 시작 결로 여유 > 0 ③ 창문 '== 0' 판정 없음 (1차 지연 · ≤ 0.05)
#    ④ 물리적으로 모든 방식이 불가능한 판정이 없는지 (개발에서 배운 것: 후드 손실 > 바닥난방 출력 · 겨울 빨래 건조)
#    ⑤ 다른 일을 하는 기준선과의 에너지 · 시간 비교 없음 (같은 셋백 계열 A2 와만)
#  2026-10-28 작성 · 원시 로그는 10 h 이상이면 10 s 간격
# ============================================================================
scenarios:
