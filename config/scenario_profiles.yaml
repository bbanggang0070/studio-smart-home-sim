    baseline_a: { auto_appliances: [dehumidifier, ac] }   # 제습기 자체 설정 → 방이 더워져 에어컨이 뒤따른다
    initial:
      user_mode: NORMAL
      temperature_c: 26.0
      humidity_pct: 80.0
      co2_ppm: 600.0
      pm25_ugm3: 10.0
      illuminance_lux: 300.0
      occupancy: true
      occupant_zone: room
      time_of_day: "16:00"
      window_open_ratio: 0.0
      blind_angle_deg: 0.0
      appliances: { ac: { power: false }, purifier_level: 0 }
    external:
      weather: rain
      outdoor_pm25_ugm3: 10.0
      outdoor_temp_c: 24.0
      outdoor_rh_pct: 95.0
      outdoor_illuminance_lux: 5000.0
    pass_criteria:
      - "humidity <= 60 within 3600 after 0"                 # 60분 내 RH ≤ 60 % (2026-10-10 완화)
      - "dehumidifier == 0 for all t"                        # I6 여름 — 에어컨 제습
      - "temperature <= 26.05 for all t"                     # 실내 온도 상승 0
      - "energy_wh <= baseline_A.energy_wh"
    metrics: [energy_wh, rule_violation_count]

  # ---- C14 · 외출 + 고습 — 부재 중 곰팡이 방어 (docs/03 §3) ------------------------------
  - id: C14
    tier: 2
    name: "외출 + 고습"
    duration_s: 21600
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20261114
    run_mode: fast
    appliance_profile: full
    season: summer
    persona: commuter
    power_limit_w: 3000
    baseline_a: { auto_appliances: [] }   # 외출 시 전부 OFF (docs/03 C14 Baseline 대비)
    initial:
      user_mode: AWAY
      temperature_c: 25.0
      humidity_pct: 72.0
      co2_ppm: 450.0
      pm25_ugm3: 10.0
      illuminance_lux: 200.0
      occupancy: false
      occupant_zone: none
      time_of_day: "09:00"
      window_open_ratio: 0.0
      blind_angle_deg: 30.0
      appliances: { ac: { power: false }, purifier_level: 0 }
    external:
      weather: clear
      outdoor_pm25_ugm3: 10.0
      outdoor_temp_c: 24.0
      outdoor_rh_pct: 85.0
    events:                         # 6시간 동안 외기 습도 상승 · 강우 간헐
      - { at_s: 3600,  set: { weather: rain,  outdoor_rh_pct: 95.0 } }
      - { at_s: 7200,  set: { weather: clear, outdoor_rh_pct: 90.0 } }
      - { at_s: 10800, set: { weather: rain,  outdoor_rh_pct: 97.0 } }
      - { at_s: 14400, set: { weather: clear, outdoor_rh_pct: 92.0 } }
    pass_criteria:
      - "ratio(humidity <= 70) >= 0.95"                      # RH ≤ 70 % 체류율 ≥ 95 %
      - "window_open_ratio == 0 for all t"                   # 보안
      - "ac_power == 0 for all t"                            # 제습기 외 가전 가동 0
      - "humidifier == 0 for all t"
    metrics: [energy_wh, rule_violation_count]

  # ---- C6 · 고습 + 저온 — 결로 대처 (docs/03 §3) --------------------------------------
  - id: C6
    tier: 2
    name: "고습 + 저온 — 결로 대처"
    duration_s: 3600
