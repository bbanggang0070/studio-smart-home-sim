# ============================================================================
#  보류(held-out) 시나리오 묶음 6차 — H601–H612 (docs/12 §15)
#  - 5차 결과 · BOPTEST 재실행에서 드러난 결함(겨울 과열 냉방 공백 · 수동 조작 방향 판정)을 고친 뒤(docs/07 v1.28 · docs/03 v2.40) 새로 만든 묶음.
#    수정 제어기로 돌려 보기 전에 썼다. 판정 문구는 기존 · 1–5차 묶음과 같다 — 조합만 새롭다 · 센서 특성 · L0 켬
#  - 실행 전에 커밋하고 해시를 동결한다(사전 등록). 결과가 나빠도 입력 · 판정을 고치지 않는다
#  - 작성 점검표: ① 모드별 습도 범위 대조 · 가습 금지 판정 없음 ② 시작 user_mode = 계속 고른 모드 ③ 시작 결로 여유 > 0
#    ④ (5차 H501) 창문 '== 0' 판정은 쓰지 않거나 판정 시작에 여유 — 고속 창문 1차 지연은 0 에 닿지 않는다
# ============================================================================

