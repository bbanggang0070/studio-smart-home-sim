    external:
      weather: clear
      outdoor_pm25_ugm3: 25.0       # 보통
      outdoor_temp_c: 27.0
      outdoor_rh_pct: 55.0
      outdoor_illuminance_lux: 20000.0
    events:                         # 보통(25) → 나쁨(52) → 매우나쁨(90)
      - { at_s: 1200, set: { outdoor_pm25_ugm3: 52.0 } }
      - { at_s: 2400, set: { outdoor_pm25_ugm3: 90.0 } }
