# ============================================================================
#  가상 센서 특성 (W07 T7.5) — 물리 모드 센서 노드가 참값에 입힌다 (고속 모드는 참값 그대로)
#  값은 데이터시트 기반 draft — 1차 지연(tau) → 가우시안 잡음(절대 sigma + 비례 rel_sigma) → 분해능 양자화 → 측정 범위 클램프
#  ROS 파라미터 파일이 아니다 (시뮬레이션 설정) — 숫자 키 · null 제약은 thresholds 와 같게 지킨다
# ============================================================================
version: 1
seed: 20261019
sensors:
  temperature:        # SHT31 — ±0.2 °C (typ)
    rate_hz: 10.0
    tau_s: 5.0
    sigma: 0.1
    rel_sigma: 0.0
    resolution: 0.01
    range: [-40.0, 125.0]
  humidity:           # SHT31 — ±2 %RH (typ)
    rate_hz: 10.0
    tau_s: 8.0
    sigma: 0.8
    rel_sigma: 0.0
    resolution: 0.01
    range: [0.0, 100.0]
  illuminance:        # BH1750 — 1 lx 분해능 · ±20 % 정확도 중 무작위 성분만 (교정 오차는 W05 캘리브레이션으로 흡수)
    rate_hz: 10.0
    tau_s: 0.2
    sigma: 0.5
    rel_sigma: 0.02
    resolution: 1.0
    range: [0.0, 65535.0]
  pm25:               # PMS7003 — ±10 µg/m³ (0–100) · ±10 % (100–500)
    rate_hz: 1.0
    tau_s: 10.0
    sigma: 2.0
    rel_sigma: 0.05
    resolution: 1.0
    range: [0.0, 1000.0]
  hood_temperature:   # DS18B20 — ±0.5 °C
    rate_hz: 1.0
    tau_s: 3.0
    sigma: 0.2
    rel_sigma: 0.0
    resolution: 0.0625
    range: [-55.0, 125.0]
  appliance_power:    # 계량 플러그 — ±3 % (docs/08 §6.3)
    rate_hz: 1.0
    tau_s: 0.0
    sigma: 0.3
    rel_sigma: 0.03
    resolution: 0.1
    range: [0.0, 4000.0]
# ---- 센서 결함 (2026-10-26 · 견고성 평가 A1 — 기본 꺼짐 · harness fast_mode.sensor_faults 로 켠다) -----------------------------
#  bias        실행마다 균등 [−b, +b] 로 뽑아 고정 (relative: true 면 값의 비율) — 데이터시트 정확도 범위
#  drift_per_h 시간 비례 드리프트 균등 [−d, +d] / h (결로 · 오염 · 노화 — 짧은 실험에서 보이게 크게 잡은 가정)
#  outlier_p   샘플당 이상값 확률 · outlier_sigma 배의 잡음 크기로 튐 (통신 오류 · 전기 잡음)
#  dropout     초당 끊김 시작 확률 · 지속 [최소, 최대] s — 그동안 마지막 값이 남는다 (I2C 오류 · Wi-Fi 재접속)
faults:
  temperature:      { bias: 0.3, drift_per_h: 0.05, outlier_p: 0.001, outlier_sigma: 10.0, dropout_p_per_s: 0.0005, dropout_s: [10.0, 60.0] }   # SHT31 ±0.3 °C (max)
  humidity:         { bias: 3.0, drift_per_h: 0.5, outlier_p: 0.001, outlier_sigma: 10.0, dropout_p_per_s: 0.0005, dropout_s: [10.0, 60.0] }    # SHT31 ±3 %RH (max)
  illuminance:      { bias: 0.2, relative: true, drift_per_h: 0.0, outlier_p: 0.001, outlier_sigma: 10.0, dropout_p_per_s: 0.0005, dropout_s: [10.0, 60.0] }   # BH1750 ±20 %
  pm25:             { bias: 0.1, relative: true, drift_per_h: 0.02, outlier_p: 0.002, outlier_sigma: 10.0, dropout_p_per_s: 0.0005, dropout_s: [10.0, 60.0] }   # PMS7003 ±10 %
  hood_temperature: { bias: 0.5, drift_per_h: 0.0, outlier_p: 0.001, outlier_sigma: 10.0, dropout_p_per_s: 0.0005, dropout_s: [10.0, 60.0] }    # DS18B20 ±0.5 °C
  appliance_power:  { bias: 0.03, relative: true, drift_per_h: 0.0, outlier_p: 0.0005, outlier_sigma: 10.0, dropout_p_per_s: 0.0005, dropout_s: [10.0, 60.0] }   # 계량 플러그 ±3 %
api:
  weather_period_s: 600.0          # 기상청 초단기실황 — 10분마다 (변경 시 즉시)
  outdoor_pm_period_s: 3600.0      # 에어코리아 — 1시간마다 (변경 시 즉시)
window_current:                    # 창문 전류 합성 (T7.4 · T7.4b) — 계수는 thresholds window_sensorless.ripple_estimation
  position_est_hz: 20.0
  hard_stop_resync_m: 0.002        # 이 안쪽에서 멈추면 하드 스톱으로 보고 리플 카운트를 0 / 끝 위치로 맞춘다
