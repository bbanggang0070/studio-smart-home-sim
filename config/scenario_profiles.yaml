# ============================================================================
#  시나리오 정의 (Scenario Profiles)  --  스키마 v2.0 (docs/03 §8) · 2026-10-09 초안
# ----------------------------------------------------------------------------
#  시나리오 추가는 코드 수정 없이 이 파일에만 항목을 더한다.
#  현재 수록: B6 · B7 · C9 (고속 모드 하네스 골격 검증용) — 40개 전량은 W09–W10 에 채운다.
#
#  [스키마 보충 — 하네스 v0.1]
#    injections[].label  : 발생원 이름. pass_criteria 에서 <label>_start · <label>_end · during: <label> 로 쓴다
#                          (생략 시 source 이름)
#    external.heating_setpoint_c : 겨울 난방 경계 조건 (가정 A13) — 없으면 난방 없음
#    external.wind_speed_ms      : 없으면 environment_model.yaml 기본 풍속
#    pass_criteria 문법 : scripts/harness/criteria.py 머리말 참조
# ============================================================================

scenarios:

  # ---- B6 · 샤워 감지 기본 (docs/03 §2) -------------------------------------------
  - id: B6
    tier: 1
    name: "샤워 감지 기본"
    duration_s: 3600
    repeat: 3
    baselines: [proposed]
    seed: 20261006
    run_mode: fast
    appliance_profile: full
    season: mid
    persona: commuter
    power_limit_w: 3000

    initial:
      user_mode: NORMAL
      temperature_c: 23.0
      humidity_pct: 50.0
      co2_ppm: 600.0
      pm25_ugm3: 12.0
      illuminance_lux: 350.0
      occupancy: true
      occupant_zone: none          # 욕실 (레이더 시야 밖)
      time_of_day: "21:00"
      window_open_ratio: 0.0
      blind_angle_deg: 30.0
      appliances:
        ac: { power: false }
        purifier_level: 0
        range_hood_level: 0

    external:
      weather: clear
      outdoor_pm25_ugm3: 12.0
      outdoor_temp_c: 18.0
      outdoor_rh_pct: 50.0         # 바깥이 건조 — I10 상 배기가 이득
      outdoor_illuminance_lux: 0.0

    injections:
      - at_s: 0
        radar: silent              # 욕실 사용 — 레이더 무신호 (재실 센서 노드 W07 이후 지원)
        duration_s: 900
      - at_s: 900
        source: shower
        label: shower
        moisture_g: 200
        duration_s: 600

    pass_criteria:
      - "event_entered('SHOWER') within 300 after shower_start"
      - "not event_entered('COOKING')"
      - "humidity <= value_at('humidity', shower_start) + 5 by 1800 after shower_start"
      - "range_hood_level == 0 for all t"

    metrics:
      - humidity_recovery_time
      - energy_wh
      - rule_violation_count

  # ---- B7 · 요리 감지 기본 (docs/03 §2) -------------------------------------------
  - id: B7
    tier: 1
    name: "요리 감지 기본"
    duration_s: 4800
    repeat: 3
    baselines: [proposed]
    seed: 20261007
    run_mode: fast
    appliance_profile: full
    season: mid
    persona: commuter
    power_limit_w: 3000

    initial:
      user_mode: NORMAL
      temperature_c: 24.0
      humidity_pct: 50.0
      co2_ppm: 600.0
      pm25_ugm3: 12.0
      illuminance_lux: 350.0
      occupancy: true
      occupant_zone: kitchen
      time_of_day: "18:30"
      window_open_ratio: 0.0
      blind_angle_deg: 30.0
      appliances:
        ac: { power: false }
        purifier_level: 1
        range_hood_level: 0

    external:
      weather: clear
      outdoor_pm25_ugm3: 12.0      # 좋음
      outdoor_temp_c: 20.0
      outdoor_rh_pct: 55.0
      outdoor_illuminance_lux: 0.0

    injections:
      - at_s: 60                   # ① 가스레인지 요리 — 전력 신호 없음
        source: cooking
        label: cook
        stove: gas
        pm_mg_per_min: 1.5
        moisture_g_per_h: 400
        heat_w: 2000
        duration_s: 900
      - at_s: 1800                 # ② 열 없는 미세먼지 (원인 미상)
        source: pm_no_heat
        label: candle
        pm_mg_per_min: 0.3
        duration_s: 1200
      - at_s: 3600                 # ③ 주전자 물 끓이기 — 열 · 수증기만
        source: cooking
        label: kettle
        stove: gas
        pm_mg_per_min: 0.0
        moisture_g_per_h: 600
        heat_w: 1500
        duration_s: 600

    expect:
      range_hood_level: { eq: 0, during: candle }

    pass_criteria:
      - "event_entered('COOKING') within 60 after cook_start"
      - "q_net >= -50 when range_hood_level > 0"
      - "range_hood_level == 0 during candle"

    metrics:
      - pm25_peak
      - pm25_recovery_time
      - energy_wh
      - rule_violation_count

  # ---- C9 · 요리 + 외기 미세먼지 매우나쁨 (docs/03 §3 · 스키마 예시 §8) -------------------
  - id: C9
    tier: 2
    name: "요리 + 외기 미세먼지 매우나쁨"
    duration_s: 3600
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20261209
    run_mode: fast
    appliance_profile: full
    season: summer
    persona: commuter
    power_limit_w: 3000

    initial:
      user_mode: NORMAL
      temperature_c: 26.0
      humidity_pct: 55.0
      co2_ppm: 750.0
      pm25_ugm3: 18.0
      illuminance_lux: 350.0
      occupancy: true
      occupant_zone: kitchen
      time_of_day: "19:00"
      window_open_ratio: 0.0
      blind_angle_deg: 30.0
      appliances:
        ac: { power: false }
        purifier_level: 1
        range_hood_level: 0

    external:
      weather: clear
      outdoor_pm25_ugm3: 150.0     # 매우나쁨 — 후드 약/강 교차점 (docs/03 C9 2026-10-09 개정, 52 → 150)
      outdoor_temp_c: 24.0
      outdoor_rh_pct: 60.0
      outdoor_illuminance_lux: 500.0

    injections:
      - at_s: 60
        source: cooking
        label: cooking
        stove: gas
        pm_mg_per_min: 1.5
        moisture_g_per_h: 400
        heat_w: 800
        duration_s: 900

    events:
      - at_s: 1800
        set: { outdoor_pm25_ugm3: 100.0 }

    expect:                        # settle_s: E1 진입 허용 지연 (pass_criteria 'within 90') 만큼 뒤부터 본다
      window_open_ratio: { max: 0.0 }
      intake_fan_rpm:    { min: 1800.0, during: cooking, settle_s: 90 }
      range_hood_level:  { eq: 1, during: cooking, settle_s: 90 }

    pass_criteria:
      - "event_entered('COOKING') within 90 after cooking_start"
      - "window_open_ratio == 0 for all t"
      - "pm25_peak <= 0.85 * baseline_A.pm25_peak"     # 지표 #10 — 2026-10-09 −30 % → −15 % (에너지 · 쾌적 비교는 2026-10-10 삭제)
      - "pm25 <= 35 within 1200 after cooking_end"

    metrics:
      - pm25_peak
      - pm25_recovery_time
      - infiltration_volume
      - energy_wh
      - rule_violation_count

  # ---- B8 · 여름 냉방 기본 — 사다리 상위 칸 (docs/03 §2) --------------------------------
  - id: B8
    tier: 1
    name: "여름 냉방 기본"
    duration_s: 3600
    repeat: 3
    baselines: [proposed]
    seed: 20261008
    run_mode: fast
    appliance_profile: full
    season: summer
    persona: commuter
    power_limit_w: 3000
    initial:
      user_mode: NORMAL
      temperature_c: 31.0
      humidity_pct: 55.0
      co2_ppm: 600.0
      pm25_ugm3: 12.0
      illuminance_lux: 600.0       # 낮 — 일사
      occupancy: true
      occupant_zone: desk
      time_of_day: "14:00"
      window_open_ratio: 0.0
      blind_angle_deg: 0.0
      appliances:
        ac: { power: false }
        purifier_level: 0
    external:
      weather: clear
      outdoor_pm25_ugm3: 12.0
      outdoor_temp_c: 33.0
      outdoor_rh_pct: 50.0
      outdoor_illuminance_lux: 60000.0
    pass_criteria:
      - "window_open_ratio <= 0.1 for all t"                  # I2 · 외기가 더 뜨거워 창문 칸 건너뜀
      - "blind_angle_deg >= 70 within 60 after 0"             # ① 차광
      - "ceiling_fan > 0 within 60 after 0"                   # ③ 실링팬 정회전
      - "ac_cool within 60 after 0"                           # ⑤ 에어컨
      - "ac_setpoint == 27 when ac_cool"                      # I5 26 → 27 완화
      - "operative_temperature <= 27 by 1800 after 0"         # 체감온도 ≤ 27 °C
      # IR 역확인 CONFIRMED 는 appliance_bridge (W10 T10.v3) 이후 판정한다
    metrics: [energy_wh, rule_violation_count]

  # ---- B9 · 겨울 건조 가습 (docs/03 §2) ----------------------------------------------
  - id: B9
    tier: 1
    name: "겨울 건조 가습"
    duration_s: 7200
    repeat: 3
    baselines: [proposed]
    seed: 20261009
    run_mode: fast
    appliance_profile: full
    season: winter
    persona: commuter
    power_limit_w: 3000
    initial:
      user_mode: NORMAL
      temperature_c: 21.0
      humidity_pct: 28.0
      co2_ppm: 600.0
      pm25_ugm3: 8.0
      illuminance_lux: 350.0
      occupancy: true
      occupant_zone: room
      time_of_day: "20:00"
      window_open_ratio: 0.0
      blind_angle_deg: 0.0
      appliances: { purifier_level: 0 }
    external:
      weather: clear
      outdoor_pm25_ugm3: 10.0
      outdoor_temp_c: 0.0
      outdoor_rh_pct: 60.0
      heating_setpoint_c: 21.0     # 가정 A13
    pass_criteria:
      - "humidity >= 40 within 7200 after 0"
      - "dew_margin >= 2.0 for all t"                        # 결로 여유 Δ ≥ 2.0 °C 상시
      - "humidifier + dehumidifier <= 1 for all t"           # I1
    metrics: [condensation_exposure_s, energy_wh, rule_violation_count]

  # ---- C1 · 고온 + 고습 + 우천 (docs/03 §3) ------------------------------------------
  - id: C1
    tier: 2
    name: "고온 + 고습 + 우천"
    duration_s: 3600
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20261101
    run_mode: fast
    appliance_profile: full
    season: summer
    persona: commuter
    power_limit_w: 3000
    baseline_a: { auto_appliances: [ac] }   # 에어컨은 켜 둔 채 자체 온도조절 (docs/03 C1 Baseline 대비)
    initial:
      user_mode: NORMAL
      temperature_c: 31.0
      humidity_pct: 78.0
      co2_ppm: 600.0
      pm25_ugm3: 12.0
      illuminance_lux: 400.0
      occupancy: true
      occupant_zone: room
      time_of_day: "15:00"
      window_open_ratio: 0.0
      blind_angle_deg: 0.0
      appliances: { ac: { power: false }, purifier_level: 0 }
    external:
      weather: rain
      outdoor_pm25_ugm3: 10.0
      outdoor_temp_c: 29.0
      outdoor_rh_pct: 95.0
      outdoor_illuminance_lux: 10000.0
    pass_criteria:
      - "window_open_ratio == 0 for all t"                   # E5
      - "cmd_ac_power within 10 after 0"                     # 강우 감지 후 10 s 이내 에어컨 기동 명령 (IR 누락 재송신은 X7)
      - "humidity <= 72 within 3600 after 0"                 # 60분 내 RH ≤ 72 % (2026-10-10 완화)
      - "exhaust_fan_rpm == 0 for all t"                     # I10 — 바깥이 더 습하다
      - "energy_wh <= baseline_A.energy_wh"
    metrics: [energy_wh, rule_violation_count]

  # ---- C5 · 수면 중 + 고온 — 소음 제약 (docs/03 §3) ------------------------------------
  - id: C5
    tier: 2
    name: "수면 중 + 고온"
    duration_s: 3600
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20261105
    run_mode: fast
    appliance_profile: full
    season: summer
    persona: commuter
    power_limit_w: 3000
    initial:
      user_mode: SLEEP
      temperature_c: 29.5
      humidity_pct: 55.0
      co2_ppm: 600.0
      pm25_ugm3: 10.0
      illuminance_lux: 0.0
      occupancy: true
      occupant_zone: bed
      time_of_day: "23:30"
      window_open_ratio: 0.0
      blind_angle_deg: 75.0
      appliances: { ac: { power: false }, purifier_level: 0 }
    external:
      weather: clear
      outdoor_pm25_ugm3: 10.0
      outdoor_temp_c: 24.0
      outdoor_rh_pct: 60.0
    pass_criteria:
      - "exhaust_fan_rpm <= 600 for all t"                    # N0
      - "intake_fan_rpm <= 700 for all t"                     # N0
      - "window_open_ratio >= 0.39 within 60 after 0"         # 창문 개방 우선 (≥ 40 %, 1차 지연 허용)
      - "temperature <= 28 within 3600 after 0"               # 예산: 온도 ≤ 28 °C (1시간 내)
    metrics: [energy_wh, rule_violation_count]

  # ---- C10 · 겨울 가습 ↔ 결로 (docs/03 §3) --------------------------------------------
  - id: C10
    tier: 2
    name: "겨울 가습 ↔ 결로"
    duration_s: 7200
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20261110
    run_mode: fast
    appliance_profile: full
    season: winter
    persona: commuter
    power_limit_w: 3000
    baseline_a: { auto_appliances: [humidifier] }   # 가습기 자체 설정 60 % (docs/03 C10)
    initial:
      user_mode: NORMAL
      temperature_c: 21.0
      humidity_pct: 30.0
      co2_ppm: 600.0
      pm25_ugm3: 8.0
      illuminance_lux: 350.0
      occupancy: true
      occupant_zone: room
      time_of_day: "20:00"
      window_open_ratio: 0.0
      blind_angle_deg: 0.0          # 블라인드 열림
      appliances: { purifier_level: 0 }
    external:
      weather: clear
      outdoor_pm25_ugm3: 10.0
      outdoor_temp_c: -5.0
      outdoor_rh_pct: 70.0
      heating_setpoint_c: 21.0
    pass_criteria:
      - "dew_margin >= 0 for all t"                          # 결로 노출 시간 0
      - "humidity >= 50 within 7200 after 0"                 # 최종 RH ≥ 50 % (상한 확장)
      - "humidifier + dehumidifier <= 1 for all t"           # I1
    metrics: [condensation_exposure_s, energy_wh, rule_violation_count]

  # ---- C13 · 장마철 제습 — 계절이 수단을 바꾼다 (docs/03 §3) ------------------------------
