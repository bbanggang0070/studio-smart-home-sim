# ============================================================================
#  보류(held-out) 시나리오 묶음 4차 — H401–H412 (docs/12 §11)
#  - 3차 묶음 결과로 수동 외출 해제 판단(재실 확정 기준) · 레이더 두절 경보를 고친 뒤(v3.4.26) 새로 만든 묶음.
#    수정 제어기로 돌려 보기 전에 썼다. 판정 문구는 기존 · 1–3차 묶음과 같다 — 조합만 새롭다 (각 판정 출처는 docs/12 §11 표)
#  - 실행 전에 커밋하고 해시를 동결한다(사전 등록). 결과가 나빠도 입력 · 판정을 고치지 않는다
#  - 작성 점검표: ① 판정이 규칙과 충돌하지 않는다 — 모드별 습도 범위(NORMAL · STUDY 40–60 · SLEEP 45–60 · AWAY 상한 70)를
#    확인했다 (H307) ② 시작 user_mode = 사용자가 계속 고른 모드 (H209) ③ 시작 결로 여유 > 0 (H3) — 환경 모델 초기 관측
# ============================================================================

scenarios:
- id: H401
  tier: 2
  name: 겨울 수면 중 레이더 두절
  duration_s: 5400
  repeat: 3
  baselines:
  - proposed
  seed: 20261401
  run_mode: fast
  appliance_profile: full
  season: winter
  persona: commuter
  power_limit_w: 3000
  initial:
    co2_ppm: 600.0
    pm25_ugm3: 10.0
    illuminance_lux: 0.0
    window_open_ratio: 0.0
    blind_angle_deg: 30.0
    appliances:
      ac:
        power: false
      purifier_level: 0
      range_hood_level: 0
    user_mode: SLEEP
    temperature_c: 20.0
    humidity_pct: 50.0
    occupancy: true
    occupant_zone: bed
    motion: sleeping
    time_of_day: 02:00
  external:
    weather: clear
    outdoor_pm25_ugm3: 10.0
    outdoor_illuminance_lux: 0.0
    outdoor_temp_c: -3.0
    outdoor_rh_pct: 65.0
    heating_setpoint_c: 20.0
  injections:
  - at_s: 600
    fault: mmwave_lost
    label: radar_lost
  pass_criteria:
  - alert_raised('S_MMWAVE') within 10 after radar_lost_start
  - exhaust_fan_rpm <= 600 for all t
  - intake_fan_rpm <= 700 for all t
  - dew_margin >= 0 for all t
  - humidifier + dehumidifier <= 1 for all t
  metrics:
  - energy_wh
  - rule_violation_count
