      - "temperature >= 19.0 for all t"                      # 실내 온도 하락 ≤ 2 °C
      - "humidifier == 0 for all t"
      - "condensation_exposure_s < baseline_A.condensation_exposure_s"   # 2026-10-10 추가 — 결로 노출 A 대비 감소
    metrics: [condensation_exposure_s, energy_wh, rule_violation_count]

  # ---- C8 · 고온 + 외기 미세먼지 — 등급형 제약 (docs/03 §3) ---------------------------------
  - id: C8
    tier: 2
    name: "고온 + 외기 미세먼지 (등급형)"
    duration_s: 3600
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20261108
    run_mode: fast
    appliance_profile: full
    season: summer
    persona: commuter
    power_limit_w: 3000
    baseline_a: { auto_appliances: [purifier] }   # 청정기 자체 자동 (docs/03 C8)
