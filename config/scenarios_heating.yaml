    duration_s: 1800
    repeat: 1
    baselines: [proposed]
    seed: 20261291
    run_mode: physics
    appliance_profile: full_heating
    season: winter
    persona: commuter
    power_limit_w: 3000
    environment_overrides: { heating.mode: hydronic }
    initial:
