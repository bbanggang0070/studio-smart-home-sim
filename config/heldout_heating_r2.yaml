      - { at_s: 21600, set: { outdoor_temp_c: 2.0, outdoor_illuminance_lux: 25000.0 } }
      - { at_s: 30600, set: { outdoor_temp_c: -1.0, outdoor_illuminance_lux: 0.0, user_mode: NORMAL, occupant_zone: kitchen } }
