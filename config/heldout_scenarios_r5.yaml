# ============================================================================
#  보류(held-out) 시나리오 묶음 5차 — H501–H512 (docs/12 §13)
#  - BOPTEST · 모드 대조 · 센서 특성 추가로 드러난 결함을 고친 뒤(docs/07 v1.27 · docs/03 v2.38) 새로 만든 묶음.
#    수정 제어기로 돌려 보기 전에 썼다. 판정 문구는 기존 · 1–4차 묶음과 같다 — 조합만 새롭다
#  - 이번부터 고속 하네스에 센서 특성(지연 · 잡음 · 양자화 · 물리 모드와 같은 모델) · L0 보호가 들어간다
#  - 실행 전에 커밋하고 해시를 동결한다(사전 등록). 결과가 나빠도 입력 · 판정을 고치지 않는다
#  - 작성 점검표: ① 모드별 습도 범위와 판정 대조 (NORMAL · STUDY 40–60 · SLEEP 45–60 · AWAY 상한 70) — 가습 금지 판정은 쓰지 않았다
#    ② 시작 user_mode = 계속 고른 모드 ③ 시작 결로 여유 > 0 — 환경 모델 초기 관측
# ============================================================================

scenarios:
- id: H501
  tier: 2
  name: 여름 아침 샤워 뒤 출근
  duration_s: 3600
  repeat: 3
  baselines:
  - proposed
  seed: 20261501
  run_mode: fast
  appliance_profile: full
  season: summer
  persona: commuter
  power_limit_w: 3000
  initial:
    co2_ppm: 600.0
    pm25_ugm3: 10.0
    illuminance_lux: 300.0
    window_open_ratio: 0.0
    blind_angle_deg: 30.0
    appliances:
      ac:
        power: false
      purifier_level: 0
      range_hood_level: 0
    user_mode: NORMAL
    temperature_c: 26.5
    humidity_pct: 58.0
    occupancy: true
    occupant_zone: room
    time_of_day: 07:30
  external:
    weather: clear
    outdoor_pm25_ugm3: 10.0
    outdoor_illuminance_lux: 20000.0
    outdoor_temp_c: 26.0
    outdoor_rh_pct: 75.0
  injections:
  - at_s: 300
    radar: silent
    duration_s: 900
  - at_s: 600
    source: shower
    label: shower
    moisture_g: 250
    duration_s: 600
  - at_s: 1800
    door: open_close
    label: leave
    open_s: 8
  events:
  - at_s: 300
    set:
      occupant_zone: none
  - at_s: 1200
    set:
      occupant_zone: room
  - at_s: 1804
    set:
      occupancy: false
      occupant_zone: none
  pass_criteria:
  - event_entered('SHOWER') within 300 after shower_start
  - occupied == 0 within 200 after leave_end
  - window_open_ratio == 0 when t >= leave_end + 200
  metrics:
  - energy_wh
  - rule_violation_count
