# ============================================================================
#  비교군 설정 (Baselines)  --  v0.1 (2026-10-09) · 근거: docs/03 §6
# ----------------------------------------------------------------------------
#  Baseline A = "실제 원룸에서 가전을 각자 쓰는 모습". 협조 규칙 · 우선순위 · 히스테리시스 · 이벤트 없음.
#  가전 내장 자동은 '사용자가 켜 둔 가전'에만 적용한다 — 시나리오의 baseline_a.auto_appliances 로 지정하고,
#  없으면 initial 에서 켜져 있는(단수 > 0) 가전으로 본다.
#  ROS 2 파라미터 파일이 아니다 — controller/baseline_a.py 가 일반 YAML 로 읽는다.
# ============================================================================

baseline_a:
  # 사용자 후드 모델 — 요리 시작 2분 후 강, 요리 끝에 끔, 습관적으로 창문을 연다
  user_hood:
    delay_s: 120.0
    level: 2
    window_habit_ratio: 0.3          # draft — 후드를 켤 때 함께 여는 창문
    # 사용자는 요리를 '안다' — 그 사실을 후드 아래 온도로 대신 읽는다 (참값과 같은 시각)
    cooking_hood_delta_c: 8.0
  # 공기청정기 내장 자동 — 자체 PM 센서 단계 (단 경계 µg/m³ → 1 · 2 · 3단)
  purifier_auto_bounds_ugm3: [15.0, 35.0]
  purifier_auto_band_ugm3: 3.0     # [2026-10-24] draft — 단을 올릴 땐 경계 + 폭, 내릴 땐 경계 − 폭 (실제 청정기의 평활 · 히스테리시스 자리.
                                   #  없으면 경계에서 매 초 단 전환 — C8 208회 · 센서 잡음 시 908회로 기준선이 실제보다 불리)
  # 제습기 · 가습기 내장 습도 설정 (서로의 존재와 결로를 모른다)
  dehumidifier_setpoint_pct: 50.0
  humidifier_setpoint_pct: 60.0
  humidistat_band_pct: 3.0           # draft — 내장 습도조절 ±폭
  # 에어컨 내장 자동 — 설정온도 26 °C 자체 온도조절 (창문 상태 모름)
  ac_setpoint_c: 26.0
  # 외출 시 사용자 습관 (시나리오 baseline_a.user_ac_away: true 일 때 — C16) — 나갈 때 끄고 귀가 후 리모컨으로 켠다
  user_ac_on_after_arrival_s: 120.0  # draft — 들어와 짐 내려놓고 켜기까지
  # 조명 사용자 습관 (시나리오 baseline_a.user_lights: true 일 때 — C4) — 어두우면 천장등을 최대로 켠다
  user_ceiling_light_pct: 100.0
  # v1.1 단독 온도 규칙 — 창문 · 배기팬이 '온도만' 본다 (강우 · 외기 · 냉방 상태를 모른다)
  temperature_rule:
    vent_on_c: 28.0
    vent_off_c: 25.0
    window_ratio: 0.4
    exhaust_rpm: 600.0
  # 수동 고정
  ceiling_fan_fixed: 1               # 실링팬 약
  # [난방 확장 docs/14 §7 · 2026-10-28 결과 보기 전 명세] 사용자는 겨울에 조절기를 실내 22 °C 로 켜 두고 그대로 둔다
  #  (외출 · 수면에도 바꾸지 않는다 · 창문 · 가습과 무관) — 가전 프로파일에 boiler 가 있는 시나리오에서만
  boiler_fixed_c: 22.0
  intake_fan_fixed_rpm: 0.0          # 흡기팬 OFF

# ============================================================================
#  Baseline A′ (A2) — 상용 스마트홈 허브 수준의 규칙 자동화 (docs/11 권장 7 · 2026-10-26)
#  결과를 보기 전에 정한 규칙 · 값 (사전 명세 — docs/12 §19). 기기마다 독립 규칙 · 히스테리시스 있음 · 협조 없음.
#  값은 상용 기본값 · 흔한 사용자 설정을 따른 가정이다 (에어컨 26 °C · 제습 55 % · 가습 40 % · 습도 스위치 70/60 %)
# ============================================================================
baseline_a2:
  ac: { setpoint_c: 26.0, on_above_c: 0.5, off_below_c: 1.0, dry_rh_pct: 65.0, dry_band_pct: 5.0, cool_resume_above_c: 1.5 }
  window: { ratio: 0.4, open_above_c: 26.5, close_below_c: 25.0, outdoor_cooler_by_c: 2.0 }
  exhaust: { on_rh_pct: 70.0, off_rh_pct: 60.0, rpm: 1400.0 }
  hood: { level: 2, cooking_hood_delta_c: 8.0, cooktop_power_w: 300.0, off_after_s: 300.0 }
  intake_rpm: 1000.0
  humidistat: { dehumidifier_pct: 55.0, humidifier_pct: 40.0, band_pct: 3.0, away_dehumidifier_pct: 70.0 }
  lighting: { dark_below_lux: 300.0, ceiling_pct: 100.0, desk_pct: 100.0 }
  blind: { shade_above_lux: 700.0, open_below_lux: 500.0, shade_deg: 75.0 }
  ceiling_fan: { on_above_c: 27.0, off_below_c: 26.0, level: 1 }
  # [난방 확장 docs/14 §7 · 2026-10-28 결과 보기 전 명세] 상용 스마트 온도조절기 — 재실(휴대폰 · 센서) 연동 + 밤 시간대
  #  협조 없음: 창문 · 가습 · 후드와 무관하게 자기 조건만 본다. 가전 프로파일에 boiler 가 있는 시나리오에서만 명령한다
  boiler: { home_c: 21.0, away_c: 16.0, away_after_s: 900.0, night_c: 19.0, night_start_h: 23.0, night_end_h: 7.0 }
