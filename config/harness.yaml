# ============================================================================
#  실험 하네스 설정 (scenario_runner)  --  v0.1 (2026-10-09) · 기획 v3.4
# ----------------------------------------------------------------------------
#  근거: docs/03 §5.3 (물리 / 고속 모드) · §7 (평가 지표) · §8 (자동화 스키마 · 하네스 동작 규약)
#  ROS 2 파라미터 파일이 아니다 — scenario_runner 가 일반 YAML 로 읽는다.
# ============================================================================

version: 1

paths:
  scenarios: config/scenario_profiles.yaml
  environment_model: config/environment_model.yaml
  results_dir: results            # 커밋하지 않는다 (.gitignore)

fast_mode:
  dt_s: 1.0                       # 환경 모델 적분 · 정책 주기 (thresholds policy_rate_hz 1 Hz 와 같게)
  log_interval_s: 1.0             # CSV 기록 간격
  # 고속 모드에서 창문 · 블라인드는 1차 지연 위치 모델로 대체한다 (docs/03 §5.3)
  actuator_time_constant_s:
    window_open_ratio: 3.0        # draft — 지표 #2 '창문 응답 ≤ 5 s' 를 만족하는 크기
    blind_angle_deg: 0.5          # draft — SG90 서보
    exhaust_fan_rpm: 2.0          # draft
    intake_fan_rpm: 2.0           # draft

# ---- 지표 정의 상수 (docs/03 §7) ---------------------------------------------
metrics:
  pm25_recovery_ugm3: 35.0        # 지표 #10 — 요리 종료 후 35 µg/m³ 복귀
  rh_recovery_delta_pct: 5.0      # 지표 #14 — 이벤트 전 + 5 %p
  rh_recovery_abs_pct: 60.0       # 지표 #14 — 또는 60 %
  co2_reference_ppm: { study: 800.0, other: 1000.0 }   # 지표 #9 (참값 검증)
  base_vent_tolerance_m3h: 0.5    # 지표 #9 — 기본 환기 충족 판정 허용 오차 (rpm 반올림)
  overheat_margin_c: 0.5          # 지표 #1 보조 — 체감온도가 모드 냉방 목표 + 0.5 °C 를 넘은 누적 시간 (overheat_time_s)
  # 지표 #8 — 장치 전환(구동) 횟수: 이산 장치는 값이 바뀔 때마다, 연속 장치는 아래 폭 이상 바뀔 때 1회
  actuation_columns: [act.ac_cool, act.ac_dry, act.ceiling_fan, act.purifier_level, act.range_hood_level,
                      act.dehumidifier, act.humidifier]
  actuation_continuous: { act.window_open_ratio: 0.05, act.exhaust_fan_rpm: 100.0, act.intake_fan_rpm: 100.0 }
  lux_temp_ok: { desk_lux_min: 600.0, temp_max_c: 28.0 }   # C4 — 책상 조도 · 실내 온도 동시 유지율 (재실 시간 중)
  tracking_steady_s: 15.0         # 지표 #3 — 지령이 이만큼 그대로인 시각만 추종 오차로 본다 (이동 중 제외) · 95 백분위
  order_check: { blind_shaded_deg: 70.0, window_opened_ratio: 0.15 }   # C3 — 블라인드 차광 도달이 창문 개방(기본 환기 틈 위)보다 먼저 (blind_lead_s)
  user_modes: config/user_modes.yaml   # 지표 #9 — 모드별 기본 환기 목표 (시나리오 initial.user_mode 기준)

# ---- 외기 PM 등급 (에어코리아 API 대체) — 환경부 PM2.5 예보 등급 -----------------
outdoor_api:
  pm_grade_bounds_ugm3: [15.0, 35.0, 75.0]
  pm_grade_names: [good, moderate, bad, very_bad]

# ---- Baseline → 제어기 구현 매핑 (docs/03 §6) ---------------------------------
#  아직 구현되지 않은 것은 'unimplemented' — 실행하면 명확한 오류로 멈춘다.
#  --controller hold 로 덮어쓰면 하네스 자체만 검증할 수 있다 (판정은 대부분 FAIL 이 정상).
controllers:
  A: "controller.baseline_a:BaselineA"   # docs/03 §6 — 장치 · 가전 독립 (가전 내장 자동 · 사용자 후드 모델)
  B: "controller.smart_home:SmartHomeController"   # docs/03 §6 — 같은 제어기, baseline=B 이면 히스테리시스 · 자동 전환 대기 0
  proposed: "controller.smart_home:SmartHomeController"   # W09 v1 — 규칙 + 모드 + 이벤트 · 6계층 중재
  proposed_np: "controller.smart_home:SmartHomeController"   # Proposed−P (docs/03 C15) — 우선 목표(L4.5) 비활성

# ---- 가전 프로파일 — 세계(참값)에 존재하는 장치 (docs/06 §7 · thresholds appliances.profiles 와 같은 구성) ----
#  프로파일에 없는 장치로 가는 명령은 무시되고 결과 notes 에 기록된다 (X8 · X2 의 전제).
appliance_profiles:
  core: [ceiling_light, desk_lamp, exhaust_fan, blind, window]
  std:  [ceiling_light, desk_lamp, exhaust_fan, blind, window, ac, range_hood, cooktop_plug]
  full: [ceiling_light, desk_lamp, exhaust_fan, blind, window,
         ac, dehumidifier, humidifier, ceiling_fan, intake_fan, purifier, range_hood, cooktop_plug]

# ---- mmWave(LD2410) 시뮬레이션 — 참값 → 구간 0–8 의 움직임 · 정지 에너지 (고속 모드 재실 노드 입력) ----
#  구간 = 0.75 m. 사람 위치(zone) → 구간은 thresholds occupancy.zone_gates 와 같은 배치를 쓴다 (센서 배치 = config/scene_layout.yaml · Scene v0.1 에서 확인).
mmwave:
  gates: 9
  noise_max: 8.0                  # draft — 모든 구간에 0–8 균등 잡음
  still_static: 55.0              # draft — 앉아 있음 (정지 · 호흡)
  sleeping_static: 45.0           # draft — 수면
  moving_moving: 65.0             # draft — 걸어 다님
  arrival_walk_s: 60.0            # 귀가 직후 방 안을 걸어 다니는 시간 (판정 창 강한 증거)
  zone_gate:                      # 사람이 있을 때 신호가 가장 센 구간
    desk: 2
    bed: 5
    kitchen: 1
    room: 4
  wifi_arrival_delay_s: [-30.0, 60.0]   # docs/08 §1.5 — 귀가 시 접속 지연 (음수 = 복도에서 먼저)

# ---- 페르소나 — 에너지 예측 학습 데이터 생성 (docs/08 §5.8 · tools/energy/train_energy_model.py) ----
#  v1: 평일 귀가 시각 = 정규 분포 + 가끔 늦는 날 (draft). 비균질 마르코프 재실 생성기는 W11 EXP-2 에서 교체.
personas:
  commuter:
    arrival_mean: "19:00"
    arrival_sd_min: 25.0
    late_probability: 0.1
    late_shift_min: 90.0
    train_weeks: 8
    weekdays_per_week: 5
    seed: 20261100
energy_training:                 # 2R2C 식별용 참값 운전 기록 (draft)
  days: 14
  dt_s: 300.0
  outdoor_mean_c: [27.0, 33.0]   # 날마다 이 범위에서 뽑는 일평균
  outdoor_swing_c: 4.0           # 일교차 반폭 (15시 최고)
  outdoor_rh_pct: 60.0
  sun_peak_lux: [20000.0, 60000.0]
  ac_setpoints_c: [24.0, 26.0, 28.0]
  ac_block_h: [1.0, 6.0]         # 에어컨 켬/끔 구간 길이 (무작위)
  occupied_probability: 0.6
  seed: 20261101
