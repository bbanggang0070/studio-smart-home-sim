# ============================================================================
#  보류(held-out) 시나리오 묶음 7차 — H701–H712 (docs/12 §17) — **마지막 차수** (사용자 결정 2026-10-25)
#  - 6차 결과로 시작 상태 · 수동 조작 구분 · 전력 한도(자기 장치 추정 · 기동 전 여유)를 고친 뒤(docs/07 v1.29) 새로 만든 묶음.
#    수정 제어기로 돌려 보기 전에 썼다. 판정 문구는 기존 · 1–6차 묶음과 같다 — 조합만 새롭다 · 센서 특성 · L0 켬
#  - 실행 전에 커밋하고 해시를 동결한다(사전 등록). 이 묶음의 결과는 고치지 않고 그대로 논문에 보고한다 (한계 포함)
#  - 작성 점검표: ① 모드별 습도 범위 대조 · 가습 금지 판정 없음 ② 시작 user_mode = 계속 고른 모드 ③ 시작 결로 여유 > 0
#    ④ 창문 '== 0' 판정 없음 (1차 지연)
# ============================================================================

scenarios:
- id: H701
  tier: 2
  name: 여름 저녁 귀가 직후 인덕션 요리 — 한도 2.5 kW
  duration_s: 4200
  repeat: 3
  baselines:
  - A
  - B
  - proposed
  seed: 20261701
  run_mode: fast
  appliance_profile: full
  season: summer
  persona: commuter
  power_limit_w: 2500
  initial:
    co2_ppm: 600.0
    pm25_ugm3: 10.0
    illuminance_lux: 300.0
    window_open_ratio: 0.0
    blind_angle_deg: 30.0
    appliances:
      ac:
        power: false
      purifier_level: 0
      range_hood_level: 0
    user_mode: NORMAL
    temperature_c: 29.0
    humidity_pct: 55.0
    occupancy: false
    occupant_zone: none
    time_of_day: '18:00'
  external:
    weather: clear
    outdoor_pm25_ugm3: 10.0
    outdoor_illuminance_lux: 8000.0
    outdoor_temp_c: 30.0
    outdoor_rh_pct: 60.0
  injections:
  - at_s: 600
    door: open_close
    label: arrive
    open_s: 8
  - at_s: 1200
    source: cooking
    label: cook
    stove: induction_plug
    pm_mg_per_min: 0.8
    moisture_g_per_h: 300
    heat_w: 1500
    duration_s: 900
  events:
  - at_s: 600
    set:
      occupancy: true
      occupant_zone: room
  - at_s: 1190
    set:
      occupant_zone: kitchen
  pass_criteria:
  - occupied == 1 within 2 after arrive_start
  - event_entered('COOKING') within 90 after cook_start
  - total_power <= 2500 when t >= cook_start + 60
  metrics:
  - energy_wh
  - rule_violation_count
