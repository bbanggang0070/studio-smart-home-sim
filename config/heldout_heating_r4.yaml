# ============================================================================
#  난방 확장 트랙 보류(held-out) 4차 — HH401–HH412 (v1.31-H · docs/15 §10 · 마지막 보류 묶음)
#  - v1.31-H 동결(e3fdf79) 뒤, 보류 3차 결과를 보기 전에 썼다 — 개발 세트 · 1 · 2 · 3차에 없는 조합
#  - 난방 계절 경계(늦가을 · 초봄) · 외출 중 보일러 고장 · 문 센서 고장 폴백 · 연속 샤워 · −18 °C 혹한 · 수동 올림 · 5일 외출 ·
#    재택 공부 하루 · 겨울비 빨래 · 짧은 외출 · 늦은 귀가 후 바로 수면
#  - 작성 점검 도구(tools/check_scenarios.py) 통과 · 결과는 고치지 않고 보고 · 이 뒤로 보류 묶음을 더 만들지 않는다
#  2026-10-29 작성
# ============================================================================
x-old-building: &old { heating.mode: hydronic, air_balance.base_infiltration_ach: 0.7, window.glazing_u_w_m2k: 4.2,
                       thermal.envelope_outdoor_conductance_w_per_k: 6.6 }
x-common: &common
  repeat: 3
  baselines: [A, B, proposed]
  run_mode: fast
  appliance_profile: full_heating
  power_limit_w: 3000
x-init: &init
  thermal_steady: true
  co2_ppm: 800.0
  pm25_ugm3: 8.0
  window_open_ratio: 0.0
  blind_angle_deg: 0.0
scenarios:
  - id: HH401
    <<: *common
    tier: 1
    name: "늦가을 저녁 귀가 — 난방 계절 경계 (외기 12 → 5 °C)"
    duration_s: 21600                    # 15:00 – 21:00
    log_interval_s: 10
    seed: 20264101
    season: autumn
    persona: commuter
    environment_overrides: { heating.mode: hydronic }
    initial:
      <<: *init
      user_mode: NORMAL
      temperature_c: 19.0
      humidity_pct: 50.0
      illuminance_lux: 200.0
      occupancy: false
      occupant_zone: none
      time_of_day: "15:00"
      appliances: { purifier_level: 0, boiler: { power: true, setpoint: 21.0 } }
    external:
      weather: cloudy
      outdoor_pm25_ugm3: 15.0
      outdoor_temp_c: 12.0
      outdoor_rh_pct: 65.0
      outdoor_illuminance_lux: 15000.0
    injections:
      - { at_s: 10800, door: open_close, label: arrive, open_s: 8 }     # 18:00
    events:
      - { at_s: 7200, set: { outdoor_temp_c: 9.0, outdoor_illuminance_lux: 3000.0 } }
      - { at_s: 10800, set: { occupancy: true, occupant_zone: room, outdoor_illuminance_lux: 0.0 } }
      - { at_s: 14400, set: { outdoor_temp_c: 5.0 } }
    pass_criteria:
      - "temperature >= 19.5 by 5400 after arrive_start"
      - "temperature <= 25.0 for all t"
      - "dew_margin >= 0 for all t"
    metrics: [cold_discomfort_kh, gas_kwh, energy_cost_won]

  - id: HH402
    <<: *common
    tier: 1
    name: "초봄 맑은 날 재택 — 강한 일사 · 외기 4 → 13 °C (난방 과잉 · 과열)"
    duration_s: 28800                    # 08:00 – 16:00
    log_interval_s: 10
    seed: 20264102
    season: spring
    persona: home
    environment_overrides: { heating.mode: hydronic }
    initial:
      <<: *init
      user_mode: NORMAL
      temperature_c: 20.5
      humidity_pct: 35.0
      illuminance_lux: 400.0
      occupancy: true
      occupant_zone: room
      time_of_day: "08:00"
      appliances: { purifier_level: 0, boiler: { power: true, setpoint: 21.0 } }
    external:
      weather: clear
      outdoor_pm25_ugm3: 20.0
      outdoor_temp_c: 4.0
      outdoor_rh_pct: 40.0
      outdoor_illuminance_lux: 40000.0
    events:
      - { at_s: 10800, set: { outdoor_temp_c: 11.0, outdoor_illuminance_lux: 70000.0 } }
      - { at_s: 18000, set: { outdoor_temp_c: 13.0, outdoor_illuminance_lux: 60000.0 } }
    pass_criteria:
      - "temperature <= 25.0 for all t"
      - "temperature >= 19.5 for all t"
      - "energy_cost_won <= baseline_A2V.energy_cost_won"
    metrics: [overheat_time_s, gas_kwh, energy_cost_won]

  - id: HH403
