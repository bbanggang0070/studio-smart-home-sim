# ============================================================================
#  보류(held-out) 시나리오 묶음 — docs/11 필수 조치 4 · docs/12 §5
#  - 제어기 동결(config/freeze.yaml controller) 뒤 처음 만든 묶음이다. 개발 · 조정에 쓰지 않았다
#  - 규칙(docs/07 I1–I10 · E1–E15)과 판정 문구는 기존 시나리오(괄호 안 출처)와 같다 — 조합만 새롭다
#  - 이 파일은 실행 전에 커밋하고 해시를 동결한다(사전 등록). 실행 뒤 판정 · 입력을 고치지 않는다
#  - 결과가 나빠도 시나리오나 판정을 바꾸지 않는다. 제어기를 고치면 새 보류 묶음(H2xx)을 다시 만든다
#  문법 = config/scenario_profiles.yaml 과 같다 (scripts/harness/scenario.py · criteria.py 머리말)
# ============================================================================

scenarios:

  # ---- H1 · 샤워 + 외기 미세먼지 나쁨 (B6 · C8 · C19) ------------------------------------
  - id: H1
    tier: 2
    name: "여름밤 샤워 + 외기 미세먼지 나쁨"
    duration_s: 3600
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20261101
    run_mode: fast
    appliance_profile: full
    season: summer
    persona: commuter
    power_limit_w: 3000
    initial:
      user_mode: NORMAL
      temperature_c: 26.0
      humidity_pct: 58.0
      co2_ppm: 650.0
      pm25_ugm3: 15.0
      illuminance_lux: 300.0
      occupancy: true
      occupant_zone: none
      time_of_day: "21:30"
      window_open_ratio: 0.0
      blind_angle_deg: 30.0
      appliances: { ac: { power: false }, purifier_level: 0, range_hood_level: 0 }
    external:
      weather: clear
      outdoor_pm25_ugm3: 80.0        # 나쁨 (E6)
      outdoor_temp_c: 24.0
      outdoor_rh_pct: 55.0           # 바깥 이슬점 14 °C < 실내 17 °C − 2 — I10 상 배기 허용
      outdoor_illuminance_lux: 0.0
    injections:
      - { at_s: 0, radar: silent, duration_s: 1200 }
      - { at_s: 600, source: shower, label: shower, moisture_g: 250, duration_s: 600 }
    pass_criteria:
      - "event_entered('SHOWER') within 300 after shower_start"                                   # B6
      - "humidity <= value_at('humidity', shower_start) + 5 by 1800 after shower_start"           # B6
      - "window_open_ratio <= 0.01 when t >= 15"                                                 # C8 (E6 창문 상한)
      - "q_net >= 0 when t >= 15"                                                                # C8 (I7 양압)
      - "pm25 <= 35 for all t"                                                                   # C8 · C19
    metrics: [humidity_recovery_time, energy_wh, rule_violation_count]

