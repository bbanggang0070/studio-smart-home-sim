# ============================================================================
#  보류(held-out) 시나리오 묶음 2차 — H201–H212 (docs/12 §7)
#  - 1차 묶음(H1–H12) 결과로 규칙 · 제어기를 고친 뒤(v3.4.24) 새로 만든 묶음이다. 수정 제어기를 이 묶음으로 돌려 보기 전에 썼다
#  - 규칙(docs/07)과 판정 문구는 기존 시나리오 · 1차 보류 묶음(괄호 안 출처)과 같다 — 조합만 새롭다
#  - 실행 전에 커밋하고 해시를 동결한다(사전 등록). 결과가 나빠도 입력 · 판정을 고치지 않는다
#  - 시작 상태 점검(제어기 없이 환경 모델 초기 관측만): 겨울 시나리오의 시작 결로 여유 > 0 (1차 H3 작성 오류 재발 방지)
# ============================================================================

