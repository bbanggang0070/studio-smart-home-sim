# ============================================================================
#  보류(held-out) 시나리오 묶음 3차 — H301–H312 (docs/12 §9)
#  - 2차 묶음(H201–H212) 결과로 겨울 후드 · 청정기 IR 결함을 고치고 수동 외출 해제 규칙을 더한 뒤(v3.4.25) 새로 만든 묶음.
#    수정 제어기로 돌려 보기 전에 썼다. 판정 문구는 기존 · 1차 · 2차 묶음(괄호 안 출처)과 같다 — 조합만 새롭다
#  - 실행 전에 커밋하고 해시를 동결한다(사전 등록). 결과가 나빠도 입력 · 판정을 고치지 않는다
#  - 작성 점검표 (1 · 2차 작성 오류에서): ① 판정이 규칙과 충돌하지 않는다 (H202) ② 시작 user_mode 는 '사용자가 계속 고른 모드'다
#    (H209) ③ 시작 결로 여유 > 0 — 환경 모델 초기 관측으로 확인, 제어기 미사용 (H3)
# ============================================================================

scenarios:

  # ---- H301 · 겨울 가스 요리 + 외기 미세먼지 나쁨 (B7 · C9 · C19 · H208) ---------------------
  - id: H301
    tier: 2
    name: "겨울 가스 요리 + 외기 미세먼지 나쁨"
    duration_s: 3600
    repeat: 3
    baselines: [A, B, proposed]
    seed: 20261301
    run_mode: fast
    appliance_profile: full
    season: winter
    persona: commuter
    power_limit_w: 3000
    initial:
      user_mode: NORMAL
      temperature_c: 21.0
      humidity_pct: 40.0
      co2_ppm: 650.0
      pm25_ugm3: 15.0
      illuminance_lux: 300.0
      occupancy: true
      occupant_zone: kitchen
      time_of_day: "19:00"
      window_open_ratio: 0.0
      blind_angle_deg: 30.0
      appliances: { ac: { power: false }, purifier_level: 1, range_hood_level: 0 }
    external:
      weather: clear
      outdoor_pm25_ugm3: 60.0
      outdoor_temp_c: -4.0
      outdoor_rh_pct: 60.0
      outdoor_illuminance_lux: 0.0
      heating_setpoint_c: 21.0
    injections:
      - { at_s: 300, source: cooking, label: cook, stove: gas, pm_mg_per_min: 1.5, moisture_g_per_h: 400, heat_w: 800, duration_s: 900 }
    pass_criteria:
      - "event_entered('COOKING') within 90 after cook_start"                                    # B7
      - "window_open_ratio <= 0.01 when t >= 15"                                                 # C8 (E6)
      - "temperature >= 19.5 for all t"                                                          # C19 · H208
      - "pm25 <= 35 within 1200 after cook_end"                                                  # C9
    metrics: [pm25_peak, energy_wh, rule_violation_count]

