# ============================================================================
#  액추에이터 조인트 제한 (W04 T4.6) — tools/isaac/build_scene.py 가 USD 조인트에 쓴다
#  드라이브 계수는 v0.1 draft — W05 T5.7/T5.8 조인트 튜닝에서 확정
# ============================================================================
version: 1
window_prismatic_joint:
  type: prismatic
  range_m: [0.0, 0.70]               # 0 = 닫힘(씰 접촉) · 0.70 = 완전 개방 (docs/04)
  max_speed_mps: 0.05                # draft — 70 cm 를 약 14 s
  # 랙-피니언 최대 힘 = 기어비 30 × Kt 0.012 × 효율 0.65 / 반경 0.01 × 전류 → 23.4 N/A · 스톨 5 A ≈ 117 N
  max_force_n: 120.0
  drive: { type: force, stiffness: 30000.0, damping: 6000.0 } # T5.1 스윕 확정 (2026-10-11 · 레일 씰 마찰 포함) — 오버슈트 0 · 정상오차 0.33 mm · 닫힘 오차 0.72 mm (W10 에서 토크 지령으로 바뀐다)
blind_joint:
  type: revolute
  range_deg: [0.0, 90.0]
  max_speed_dps: 30.0
  max_torque_nm: 0.5
  drive: { type: force, stiffness: 0.05, damping: 0.01 }
exhaust_fan_joint:
  type: revolute_velocity
  max_rpm: 2000.0
  max_torque_nm: 0.2
  drive: { type: force, stiffness: 0.0, damping: 0.05 }
intake_fan_joint:
  type: revolute_velocity
  max_rpm: 2000.0
  max_torque_nm: 0.2
  drive: { type: force, stiffness: 0.0, damping: 0.05 }
ceiling_fan_joint:
  type: revolute_velocity
  max_rpm: 200.0                     # 강 ≈ 200 rpm · 약 ≈ 100 rpm (역회전 = 음수)
  levels_rpm: [0.0, 100.0, 200.0]    # /studio/cmd/ceiling_fan 단 0 · 1(약) · 2(강) → rpm (부호 = 방향)
  max_torque_nm: 2.0
  drive: { type: force, stiffness: 0.0, damping: 0.5 }
entrance_door_joint:
  type: revolute
  range_deg: [0.0, 100.0]
  max_torque_nm: 60.0
  drive: { type: force, stiffness: 200.0, damping: 40.0 }
bathroom_door_joint:                 # [Scene v0.3] 화장실 문 — 화장실 쪽으로 열림 (양수 = 열림) · 제어 · 판정에 쓰지 않는다 (GUI 에서 Target Position 으로 여닫기)
  type: revolute
  range_deg: [0.0, 100.0]
  max_torque_nm: 40.0
  drive: { type: force, stiffness: 150.0, damping: 30.0 }
bridge:                              # isaac_actuator_bridge (W06)
  physics_hz: 120.0                  # scene_layout physics.steps_per_second 와 같게
  state_hz: 20.0                     # 액추에이터 상태 토픽 (명령→반응 지연 측정 해상도 50 ms)
  current_hz: 50.0                   # /studio/sensor/window_motor_current
  render_every_n_steps: 2            # GUI 일 때만
  obstacle_tolerance_m: 0.01         # [2026-10-26] 시험 물체가 놓은 자리에서 이만큼 벗어나면(창문이 움직이기 전 · 접촉 전) 다시 놓는다
  obstacle_check_until_ratio: 0.02   #   창문 열림이 이보다 작을 때까지만 확인 (그 뒤 움직임은 끼임 반응이라 건드리지 않는다)

